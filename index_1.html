<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SamaLedger – prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF3F1;--card:#fff;--ink:#12302A;--mut:#5C7770;--line:#D3DFDB;--ok:#1F6F5C;--warn:#C8892B;--bad:#B3402A;--ac:#12302A;--acx:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1B18;--card:#152924;--card:#152924;--ink:#E4EFEB;--mut:#8DAAA2;--line:#26413A;--ok:#4FC1A3;--warn:#E3A94D;--bad:#E4735B;--ac:#4FC1A3;--acx:#0D1B18}}
:root[data-theme="dark"]{--bg:#0D1B18;--card:#152924;--ink:#E4EFEB;--mut:#8DAAA2;--line:#26413A;--ok:#4FC1A3;--warn:#E3A94D;--bad:#E4735B;--ac:#4FC1A3;--acx:#0D1B18}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Figtree,system-ui,sans-serif}
h1,h2,.big{font-family:"Bricolage Grotesque",Georgia,serif;margin:0}
header{padding:20px 20px 0;max-width:1000px;margin:auto}
h1{font-size:28px}header p{margin:2px 0 14px;color:var(--mut)}
nav{display:flex;gap:6px;overflow-x:auto;border-bottom:1px solid var(--line);max-width:1000px;margin:auto;padding:0 20px}
nav button{background:none;border:0;color:var(--mut);padding:10px 14px;font:600 15px Figtree,system-ui;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button[aria-selected=true]{color:var(--ink);border-color:var(--warn)}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
main{max-width:1000px;margin:auto;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.card small{color:var(--mut)}.big{font-size:26px;display:block;margin-top:4px}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mut);font-weight:600}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid currentColor}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.btn{background:var(--ac);color:var(--acx);border:0;border-radius:8px;padding:8px 14px;font:600 14px Figtree,system-ui;cursor:pointer}
.btn.s{background:none;color:var(--ink);border:1px solid var(--line);padding:4px 10px}
textarea{width:100%;min-height:110px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px;font:13px ui-monospace,Menlo,monospace}
.bar{height:12px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%}
.why{color:var(--mut);font-size:13px}.row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
h2{font-size:20px;margin:22px 0 10px}
:root,:root[data-theme],:root:not([data-theme="light"]){--bg:#060B14;--card:#0C1424;--ink:#E6F1FF;--mut:#7F95B3;--line:#1A2B47;--ok:#2EF2B0;--warn:#FFB020;--bad:#FF4D6D;--ac:#38BDF8;--acx:#03101C}
body{background:radial-gradient(900px 500px at 85% -10%,#1B2C6B66,transparent),radial-gradient(700px 400px at -10% 10%,#0A4D6B66,transparent),var(--bg);background-attachment:fixed;min-height:100vh}
h1,h2,.big{font-family:Sora,"Bricolage Grotesque",system-ui,sans-serif}
h1{background:linear-gradient(90deg,#38BDF8,#A78BFA);-webkit-background-clip:text;background-clip:text;color:transparent}
.card{background:linear-gradient(160deg,#0F1A2E,#0A1120);box-shadow:0 0 0 1px #38BDF811,0 8px 30px #0008}
.big{text-shadow:0 0 18px currentColor}
nav button[aria-selected=true]{color:var(--ac);border-color:var(--ac)}
.btn{box-shadow:0 0 14px #38BDF855}.bar{background:#13223B}
details{border-bottom:1px solid var(--line)}summary{cursor:pointer;padding:10px 4px;font-weight:600}
svg text{fill:var(--mut);font:11px Figtree,system-ui}
.in{width:100%;padding:9px;margin:4px 0 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
nav{position:fixed;inset:0 auto 0 0;width:196px;flex-direction:column;gap:2px;border:0;border-right:1px solid var(--line);background:#070E1B;padding:calc(18px + env(safe-area-inset-top,0px)) 12px 12px;max-width:none;margin:0;overflow:visible;z-index:5}
nav .brand{font:700 20px Sora,system-ui,sans-serif;background:linear-gradient(90deg,#38BDF8,#A78BFA);-webkit-background-clip:text;background-clip:text;color:transparent;padding:0 8px 18px}
nav button{text-align:left;border-radius:8px;border-bottom:0;padding:10px}
nav button[aria-selected=true]{background:#38BDF822;color:var(--ac);box-shadow:inset 3px 0 var(--ac)}
header,main{margin-left:196px;max-width:none}
.pill{border:1px solid var(--line);border-radius:99px;padding:5px 14px;color:var(--mut);font-size:13px;background:#0C1424}
.dg{display:grid;gap:14px;grid-template-columns:2fr 1fr}.dg3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.dg h2{font-size:15px;margin:0 0 8px}
.badge{width:70px;height:70px;border-radius:50%;border:3px solid currentColor;display:grid;place-items:center;font-size:32px;margin:6px auto 12px;box-shadow:0 0 28px currentColor,inset 0 0 18px #0006}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}
@media(max-width:760px){nav{position:static;width:auto;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:10px}nav .brand{display:none}header,main{margin-left:0}.dg{grid-template-columns:1fr}}
</style><link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&display=swap" rel="stylesheet"></head><body>
<header><div class="row"><h1 id="ttl">Vue financière</h1><span class="pill">XOF · données réelles de votre société</span></div><p>Comptabilité SYSCOHADA automatisée, contrôlée par vos comptables</p><p id="note" class="warn" style="margin:0"></p></header>
<nav role="tablist" id="tabs"></nav>
<main id="v"></main>
<script>
const F=n=>Math.round(n).toLocaleString('fr-FR').replace(/\u202f/g,' ')+' F';
const RULES=[
{k:/FRAIS|COMMISSION|AGIOS/i,d:'631',c:'521',lib:'Frais bancaires',why:"le libellé contient des frais bancaires (compte 631)."},
{k:/RETRAIT|DAB/i,d:'571',c:'521',lib:'Retrait espèces',why:"un retrait DAB alimente la caisse (compte 571)."},
{k:/SALAIRE|PAIE/i,d:'661',c:'521',lib:'Salaires',why:"le libellé évoque la paie (compte 661)."},
{k:/WAVE|ORANGE|OM |KIRENE|CLIENT|BOUTIQUE/i,d:'521',c:'411',lib:'Encaissement client',why:"l'entrée provient d'un canal de vente connu, rapprochée d'un client (compte 411)."},
{k:/FOURN|ABC|SENELEC|SONATEL|SDE|ACHAT/i,d:'401',c:'521',lib:'Paiement fournisseur',why:"le bénéficiaire correspond à un fournisseur (compte 401)."}];
const PLAN={521:'Banque',571:'Caisse',411:'Clients',401:'Fournisseurs',631:'Frais bancaires',661:'Salaires'};
const FACT=[{n:'F-2026-145',t:'Kirène – distribution',m:150000},{n:'F-2026-152',t:'Boutique Mamadou',m:80000},{n:'F-2026-160',t:'Orange Money – vente',m:25000}];
let BUD=[{d:'Production',b:500e6,s:420e6},{d:'Marketing',b:120e6,s:95e6}];
let SRC=`2026-09-01;VIR WAVE Kirène;150000
2026-09-02;VIR ORANGE MONEY boutique Mamadou;80000
2026-09-03;PAIEMENT FOURN ABC;-95000
2026-09-03;FRAIS BANCAIRES TENUE COMPTE;-3500
2026-09-04;RETRAIT DAB PLATEAU;-40000
2026-09-04;VIR ORANGE MONEY 25000;25000
2026-09-04;VIR ORANGE MONEY 25000;25000
2026-09-05;VIREMENT INCONNU XZ;60000`;
let TX=[],INV=[],REG=false,tab='Tableau de bord',TOKEN=(()=>{try{return localStorage.getItem('sl')||''}catch(e){return ''}})(),BASE=(()=>{try{return localStorage.getItem('slbase|'+location.origin)}catch(e){return null}})()??(location.protocol=='file:'?'http://localhost:8000':'');
function classify(){
 TX=[];const seen={};
 SRC.split('\n').map(l=>l.trim()).filter(Boolean).forEach((l,i)=>{
  const [date,lib,m]=l.split(';');const amt=parseFloat(m);if(!date||!lib||isNaN(amt))return;
  const key=date+lib+amt;const r=RULES.find(r=>r.k.test(lib));
  let e={id:i,date,lib,amt,rule:r||null,valid:false,dup:!!seen[key],match:null};seen[key]=1;
  if(r){e.d=r.d;e.c=r.c;e.why="J'ai classé cette opération comme « "+r.lib+" » car "+r.why}
  else{e.d=amt>0?'521':'471';e.c=amt>0?'471':'521';e.why="Je ne reconnais pas ce tiers : écriture en compte d'attente (471), à valider par un comptable."}
  if(amt>0){const f=FACT.find(f=>f.m===amt&&!TX.some(t=>t.match===f.n));if(f&&!e.dup)e.match=f.n}
  e.conf=r?(e.match||amt<0?'élevée':'moyenne'):'faible';
  TX.push(e)})}
function status(e){return e.dup?['Doublon possible','bad']:e.match?['Rapproché '+e.match,'ok']:!e.rule?['À vérifier','warn']:e.amt<0?['Justifié','ok']:['Sans facture','warn']}
function render(){if(!TOKEN){authView();return}
 tabs.innerHTML='<div class="brand">SamaLedger</div>'+['Tableau de bord','Banque','Factures','Journal','États','Budgets','Plan comptable'].map(t=>`<button role="tab" aria-selected="${t==tab}" onclick="tab='${t}';render()">${IC[t]}&nbsp; ${t}</button>`).join('')+'<button onclick="logout()" style="margin-top:auto">⎋&nbsp; Déconnexion</button>';
 const ent=TX.filter(t=>t.amt>0).reduce((a,t)=>a+t.amt,0),sor=-TX.filter(t=>t.amt<0).reduce((a,t)=>a+t.amt,0);
 const alerts=TX.filter(t=>status(t)[1]!='ok').length,valid=TX.filter(t=>t.valid).length;
 let h='';
 if(tab=='Tableau de bord'){h=dash(ent,sor,alerts,valid)}
 if(0){
  const open=FACT.filter(f=>!TX.some(t=>t.match===f.n)).reduce((a,f)=>a+f.m,0);
  h=`<div class="grid"><div class="card"><small>Solde du mois</small><span class="big">${F(ent-sor)}</span></div>
  <div class="card"><small>Entrées</small><span class="big ok">${F(ent)}</span></div>
  <div class="card"><small>Sorties</small><span class="big bad">${F(sor)}</span></div>
  <div class="card"><small>Créances non rapprochées</small><span class="big">${F(open)}</span></div></div>
  ${chart()}<h2>Ce matin, le moteur a traité ${TX.length} opérations</h2>
  <div class="card"><p>${valid} écritures validées, ${TX.length-valid} en attente de contrôle.</p>
  <p class="${alerts?'warn':'ok'}"><b>${alerts} point(s) d'attention</b> : doublons, tiers inconnus ou entrées sans facture.</p>
  <button class="btn" onclick="tab='Banque';render()">Contrôler les opérations</button></div>
  <h2>Budgets</h2>${budHTML()}`}
 if(tab=='Banque'){
  h=`<div class="card"><label for="src"><b>Relevé bancaire</b> <span class="why">(date;libellé;montant – collez votre CSV)</span></label>
  <textarea id="src">${SRC}</textarea><p><button class="btn" onclick="importCsv()">Importer et classer</button> <input type="file" accept=".csv,.txt" onchange="fileIn(this)"></p></div>
  <h2>Opérations classées</h2><div class="card scroll"><table><tr><th>Date</th><th>Libellé</th><th class="n">Montant</th><th>Écriture</th><th>Statut</th><th></th></tr>
  ${TX.map(e=>{const s=status(e);return`<tr><td>${e.date}</td><td>${e.lib}<div class="why">${e.why}</div></td><td class="n ${e.amt<0?'bad':'ok'}">${F(e.amt)}</td>
  <td>D ${e.d}<br>C ${e.c}</td><td><span class="tag ${s[1]}">${s[0]}</span><div class="why">Confiance ${e.conf}</div></td>
  <td>${e.valid?'<span class="ok">✔</span>':`${e.dup?`<button class="btn s" onclick="rejectOne('${e.id}')">Rejeter</button>`:`<button class="btn s" onclick="validateOne('${e.id}')">Valider</button>`}`}</td></tr>`}).join('')}</table></div>
  <p><button class="btn s" onclick="validateSafe()">Valider toutes les opérations sûres</button></p>`}
 if(tab=='Journal'){
  const L=TX.filter(t=>t.valid);let D=0;
  h=`<h2>Journal de banque</h2>`+(L.length?`<div class="card scroll"><table><tr><th>Date</th><th>Compte</th><th>Libellé</th><th class="n">Débit</th><th class="n">Crédit</th></tr>
  ${L.map(e=>{const a=Math.abs(e.amt);D+=a;return`<tr><td>${e.date}</td><td>${e.d}<br>${e.c}</td><td>${PLAN[e.d]||'Compte d\'attente'}<br>${PLAN[e.c]||'Compte d\'attente'}</td><td class="n">${F(a)}<br>&nbsp;</td><td class="n">&nbsp;<br>${F(a)}</td></tr>`}).join('')}
  <tr><th colspan="3">Totaux (partie double)</th><th class="n">${F(D)}</th><th class="n">${F(D)}</th></tr></table></div>
  <p class="ok"><b>Balance équilibrée</b> : total débit = total crédit.</p>`:`<div class="card">Aucune écriture validée. Allez dans Banque et validez des opérations pour les voir ici.</div>`)+
  `<h2>Plan comptable (extrait SYSCOHADA)</h2><div class="card">${Object.entries(PLAN).map(([k,v])=>`<span class="tag" style="margin:3px">${k} ${v}</span>`).join('')}</div>`}
 if(tab=='Factures')h=facHTML();
 if(tab=='États'){const B={};TX.filter(t=>t.valid).forEach(e=>{const a=Math.abs(e.amt);(B[e.d]=B[e.d]||{d:0,c:0}).d+=a;(B[e.c]=B[e.c]||{d:0,c:0}).c+=a});
  const ks=Object.keys(B).sort();let TD=0,TC=0;
  h=`<h2>Balance générale</h2>`+(ks.length?`<div class="card scroll"><table><tr><th>Compte</th><th>Intitulé</th><th class="n">Débit</th><th class="n">Crédit</th><th class="n">Solde</th></tr>${ks.map(k=>{TD+=B[k].d;TC+=B[k].c;const s=B[k].d-B[k].c;return`<tr><td>${k}</td><td>${nm(k)}</td><td class="n">${F(B[k].d)}</td><td class="n">${F(B[k].c)}</td><td class="n ${s<0?'bad':'ok'}">${F(Math.abs(s))} ${s<0?'C':'D'}</td></tr>`}).join('')}<tr><th colspan="2">Totaux</th><th class="n">${F(TD)}</th><th class="n">${F(TC)}</th><th class="n ${TD==TC?'ok':'bad'}">${TD==TC?'Équilibrée':'Écart'}</th></tr></table></div>`:`<div class="card">Validez des opérations dans Banque pour produire la balance.</div>`)}
 if(tab=='Plan comptable')h=`<h2>Plan comptable SYSCOHADA révisé</h2><div class="card"><input placeholder="Rechercher un compte (ex. 631, banque, TVA)" oninput="fp(this.value)" style="width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit">${CL.map(c=>`<details open><summary>Classe ${c[0]} – ${c[1]}</summary><table>${c[2].map(a=>`<tr data-s="${(a[0]+' '+a[1]).toLowerCase()}"><td style="width:70px"><b>${a[0]}</b></td><td>${a[1]}</td></tr>`).join('')}</table></details>`).join('')}</div>`;
 if(tab=='Budgets')h=`<h2>Budget et consommation</h2>${budHTML()}`;
 v.innerHTML=h;ttl.textContent=tab=='Tableau de bord'?'Vue financière':tab;if(tab=='Tableau de bord')startGlobe()}
function budHTML(){return `<div class="grid">${BUD.map(x=>{const p=x.s/x.b*100,c=p>90?'var(--bad)':p>80?'var(--warn)':'var(--ok)';
 return`<div class="card"><div class="row"><b>${x.d}</b><span>${p.toFixed(0)} %</span></div><div class="bar"><i style="width:${Math.min(p,100)}%;background:${c}"></i></div>
 <small>${F(x.s)} dépensés sur ${F(x.b)} – reste ${F(x.b-x.s)}</small>${p>80?`<div class="warn"><b>Alerte</b> : plus de 80 % du budget consommé.</div>`:''}</div>`}).join('')}</div>`}
const CL=[['1','Ressources durables',[['10','Capital'],['11','Réserves'],['12','Report à nouveau'],['13','Résultat net de l\'exercice'],['14','Subventions d\'investissement'],['16','Emprunts et dettes assimilées']]],
['2','Actif immobilisé',[['21','Immobilisations incorporelles'],['22','Terrains'],['23','Bâtiments et installations'],['24','Matériel, mobilier et actifs biologiques'],['245','Matériel de transport'],['26','Titres de participation'],['28','Amortissements'],['29','Dépréciations de l\'actif immobilisé']]],
['3','Stocks',[['31','Marchandises'],['32','Matières premières et fournitures liées'],['33','Autres approvisionnements'],['34','Produits en cours'],['36','Produits finis'],['39','Dépréciations des stocks']]],
['4','Comptes de tiers',[['401','Fournisseurs, dettes en compte'],['411','Clients'],['421','Personnel, avances et acomptes'],['422','Personnel, rémunérations dues'],['431','Sécurité sociale'],['4431','État, TVA facturée sur ventes'],['4452','État, TVA récupérable sur achats'],['447','État, impôts retenus à la source'],['471','Comptes d\'attente']]],
['5','Comptes de trésorerie',[['52','Banques'],['521','Banques locales'],['55','Instruments de monnaie électronique (Wave, Orange Money)'],['56','Banques, crédits de trésorerie'],['57','Caisse'],['571','Caisse siège']]],
['6','Charges des activités ordinaires',[['60','Achats et variations de stocks'],['61','Transports'],['62','Services extérieurs A'],['63','Services extérieurs B'],['631','Frais bancaires'],['64','Impôts et taxes'],['66','Charges de personnel'],['661','Rémunérations directes'],['67','Frais financiers'],['68','Dotations aux amortissements']]],
['7','Produits des activités ordinaires',[['70','Ventes'],['701','Ventes de marchandises'],['71','Subventions d\'exploitation'],['75','Autres produits'],['77','Revenus financiers'],['78','Transferts de charges']]],
['8','Autres charges et produits (HAO)',[['81','Valeurs comptables des cessions'],['82','Produits des cessions d\'immobilisations'],['83','Charges HAO'],['84','Produits HAO'],['87','Participation des travailleurs'],['89','Impôts sur le résultat']]]];
const ALL=CL.flatMap(c=>c[2]);
function nm(k){const a=ALL.find(x=>x[0]==k);return a?a[1]:(PLAN[k]||'Compte')}
function fp(q){q=q.toLowerCase();document.querySelectorAll('tr[data-s]').forEach(r=>r.style.display=r.dataset.s.includes(q)?'':'none');
 document.querySelectorAll('details').forEach(d=>d.style.display=[...d.querySelectorAll('tr')].some(r=>r.style.display!='none')?'':'none')}
function chart(){const D={};TX.forEach(t=>{const o=D[t.date]=D[t.date]||{e:0,s:0};t.amt>0?o.e+=t.amt:o.s-=t.amt});
 const ds=Object.keys(D).sort(),mx=Math.max(1,...ds.flatMap(d=>[D[d].e,D[d].s])),w=600/Math.max(ds.length,1);
 return`<h2>Flux de trésorerie par jour</h2><div class="card"><svg viewBox="0 0 600 190" width="100%" role="img" aria-label="Entrées et sorties par jour">${ds.map((d,i)=>{const x=i*w+w/2,he=D[d].e/mx*140,hs=D[d].s/mx*140;
 return`<rect x="${x-24}" y="${150-he}" width="22" height="${he}" rx="3" style="fill:var(--ok)"/><rect x="${x+2}" y="${150-hs}" width="22" height="${hs}" rx="3" style="fill:var(--bad)"/><text x="${x}" y="172" text-anchor="middle">${d.slice(5)}</text>`}).join('')}</svg>
 <small><span class="ok">■</span> Entrées &nbsp; <span class="bad">■</span> Sorties</small></div>`}
const IC={'Tableau de bord':'◧','Banque':'⌂','Factures':'▤','Journal':'☰','États':'∑','Budgets':'◔','Plan comptable':'❖'};
function spark(v,col){const mx=Math.max(...v,1),mn=Math.min(...v,0),r=mx-mn||1,w=100/Math.max(v.length-1,1);
 return`<svg viewBox="0 0 100 30" width="100%" height="34" preserveAspectRatio="none"><polyline fill="none" style="stroke:${col}" stroke-width="2" vector-effect="non-scaling-stroke" points="${v.map((x,i)=>(i*w)+','+(28-(x-mn)/r*26)).join(' ')}"/></svg>`}
function dash(ent,sor,alerts,valid){
 const D={};TX.forEach(t=>{const o=D[t.date]=D[t.date]||{e:0,s:0};t.amt>0?o.e+=t.amt:o.s-=t.amt});
 const ds=Object.keys(D).sort(),E=ds.map(d=>D[d].e),S=ds.map(d=>D[d].s);let c=0;const C=ds.map(d=>c+=D[d].e-D[d].s);
 const nOpen=FACT.filter(f=>!TX.some(t=>t.match===f.n)),open=nOpen.reduce((a,f)=>a+f.m,0);

 const mx=Math.max(...C,1),mn=Math.min(...C,0),r=mx-mn||1,X=i=>30+i*(560/Math.max(ds.length-1,1)),Y=v=>170-(v-mn)/r*150;
